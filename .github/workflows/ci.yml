name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Framework boundary checks
        run: |
          if grep -R -n 'ngx_' include; then
            echo "public headers must not expose Nginx symbols" >&2
            exit 1
          fi
          if grep -R -n '#include .*ngx_' src/core src/router src/middleware src/internal; then
            echo "Nginx headers must stay inside the adapter" >&2
            exit 1
          fi

      - name: Unit tests
        run: make test

      - name: ASan and UBSan
        run: |
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 make test-sanitize

      - name: Install Nginx build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre2-dev zlib1g-dev curl

      - name: Download Nginx
        run: |
          curl -fsSLO https://nginx.org/download/nginx-1.30.5.tar.gz
          tar xzf nginx-1.30.5.tar.gz

      - name: Run full nnx integration suite
        run: ./scripts/integration-test.sh ./nginx-1.30.5

      - name: Verify worker crash isolation
        run: ./scripts/worker-crash-test.sh ./nginx-1.30.5

      - name: Show Nginx log on failure
        if: failure()
        run: cat /tmp/nnx-nginx.log || true

      - name: Stop Nginx
        if: always()
        run: |
          if [ -f /tmp/nnx-nginx.pid ]; then
            kill "$(cat /tmp/nnx-nginx.pid)" 2>/dev/null || true
          fi
