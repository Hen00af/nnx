name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: make test

      - name: Install Nginx build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre2-dev zlib1g-dev curl

      - name: Download Nginx
        run: |
          curl -fsSLO https://nginx.org/download/nginx-1.30.5.tar.gz
          tar xzf nginx-1.30.5.tar.gz

      - name: Build and run nnx example
        run: |
          ./scripts/run-example.sh ./nginx-1.30.5 > /tmp/nnx-nginx.log 2>&1 &
          echo $! > /tmp/nnx-nginx.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /tmp/nnx-body; then
              break
            fi
            sleep 1
          done
          grep -qx 'Hello, nnx!' /tmp/nnx-body

          curl -fsS -X POST             -H 'Content-Type: text/plain'             --data 'body-through-nginx'             http://127.0.0.1:8080/echo > /tmp/nnx-echo
          grep -qx 'body-through-nginx' /tmp/nnx-echo

      - name: Show Nginx log on failure
        if: failure()
        run: cat /tmp/nnx-nginx.log || true

      - name: Stop Nginx
        if: always()
        run: |
          if [ -f /tmp/nnx-nginx.pid ]; then
            kill "$(cat /tmp/nnx-nginx.pid)" 2>/dev/null || true
          fi
